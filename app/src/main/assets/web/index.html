<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LocalDrop - Direct Share</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #0b0f17; color: #f1f5f9; min-height: 100vh; padding: 24px 16px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 520px; }
    h1 { font-size: 24px; font-weight: 800; color: #fff; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; }
    h1::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: #22c55e; }
    .status { font-size: 14px; color: #94a3b8; margin-bottom: 20px; }
    .status.err { color: #ef4444; }
    .file-card { background: #131b2a; border: 1px solid #1e293b; border-radius: 14px; padding: 14px 16px; margin-bottom: 12px; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
    .file-info { min-width: 0; flex: 1; }
    .file-name { font-size: 15px; font-weight: 600; color: #f8fafc; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 4px; }
    .file-meta { font-size: 12px; color: #64748b; }
    .btn { background: #2563eb; color: #fff; text-decoration: none; font-size: 13px; font-weight: 700; padding: 10px 16px; border-radius: 10px; display: inline-block; letter-spacing: 0.02em; white-space: nowrap; border: none; cursor: pointer; }
    .btn:hover { background: #1d4ed8; }
    .empty { background: #131b2a; border: 1px dashed #334155; border-radius: 14px; padding: 32px 16px; text-align: center; color: #94a3b8; font-size: 14px; }
    .ad-card { margin-top: 24px; padding: 16px; background: rgba(255,255,255,0.03); border: 1px solid #1e293b; border-radius: 16px; }
    .ad-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .ad-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #3b82f6; font-weight: 700; }
    .ad-badge { font-size: 10px; color: #94a3b8; background: rgba(255,255,255,0.08); padding: 2px 6px; border-radius: 4px; }
    .video-wrap { border-radius: 12px; overflow: hidden; background: #000; box-shadow: 0 4px 16px rgba(0,0,0,0.5); }
    video { width: 100%; max-height: 220px; display: block; object-fit: cover; }
  </style>
</head>
<body>
<div class="container">
  <h1>LocalDrop</h1>
  <div id="status" class="status">Connecting to sender…</div>
  <div id="fileList"></div>

  <!-- Receiver Video Ad -->
  <div class="ad-card">
    <div class="ad-header">
      <span class="ad-title">Sponsored Promotion</span>
      <span class="ad-badge">Ad</span>
    </div>
    <div class="video-wrap">
      <video autoplay muted loop playsinline controls>
        <source src="https://commondatastorage.googleapis.com/gtv-videos-bucket/sample/ForBiggerBlazes.mp4" type="video/mp4">
        Your browser does not support HTML5 video.
      </video>
    </div>
  </div>
</div>

<script>
(function () {
  function sessionTokenFromPath() {
    var m = window.location.pathname.match(/^\/s\/([A-Za-z0-9_-]+)/);
    return m ? m[1] : null;
  }

  var token = sessionTokenFromPath();
  var statusEl = document.getElementById('status');
  var listEl = document.getElementById('fileList');

  function formatBytes(bytes) {
    if (bytes <= 0) return '0 B';
    var units = ['B', 'KB', 'MB', 'GB', 'TB'];
    var i = Math.min(units.length - 1, Math.floor(Math.log(bytes) / Math.log(1024)));
    var value = bytes / Math.pow(1024, i);
    return (i === 0 ? bytes : value.toFixed(1)) + ' ' + units[i];
  }

  function renderFiles(files) {
    listEl.innerHTML = '';
    if (!files.length) {
      listEl.innerHTML = '<div class="empty">No files are currently shared.</div>';
      return;
    }
    files.forEach(function (f) {
      var card = document.createElement('div');
      card.className = 'file-card';
      card.innerHTML =
        '<div class="file-info">' +
          '<div class="file-name">' + escapeHtml(f.name) + '</div>' +
          '<div class="file-meta">' + formatBytes(f.size) + ' · ' + escapeHtml(f.mime) + '</div>' +
        '</div>' +
        '<a class="btn" download="' + escapeHtml(f.name) + '" href="/api/download/' + encodeURIComponent(f.token) + '?s=' + encodeURIComponent(token) + '">DOWNLOAD</a>';
      listEl.appendChild(card);
    });
  }

  function escapeHtml(str) {
    if (!str) return '';
    return String(str).replace(/[&<>"']/g, function(m) {
      return {'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[m];
    });
  }

  if (!token) {
    statusEl.textContent = 'Invalid or missing connection link.';
    statusEl.className = 'status err';
    return;
  }

  fetch('/api/files?s=' + encodeURIComponent(token))
    .then(function (r) {
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    })
    .then(function (data) {
      statusEl.textContent = 'Connected! Ready to download (' + data.length + ' file' + (data.length === 1 ? '' : 's') + ' available)';
      renderFiles(data);
    })
    .catch(function (err) {
      statusEl.textContent = 'Failed to connect: ' + err.message;
      statusEl.className = 'status err';
    });
})();
</script>
</body>
</html>
