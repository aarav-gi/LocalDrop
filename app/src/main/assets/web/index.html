<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Share - Download</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #0F172A; color: #F8FAFC; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 24px 16px; }
    .container { width: 100%; max-width: 540px; }
    .header { text-align: center; margin-bottom: 24px; }
    .header h1 { font-size: 24px; font-weight: 700; color: #38BDF8; margin-bottom: 6px; }
    .header p { font-size: 14px; color: #94A3B8; }
    .badge { display: inline-block; padding: 4px 12px; background: rgba(56, 189, 248, 0.1); border: 1px solid rgba(56, 189, 248, 0.3); border-radius: 20px; font-size: 12px; color: #38BDF8; margin-top: 10px; }
    .card { background: #1E293B; border: 1px solid #334155; border-radius: 16px; padding: 20px; margin-top: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
    .file-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 0; border-bottom: 1px solid #334155; }
    .file-item:last-child { border-bottom: none; }
    .file-details { flex: 1; padding-right: 12px; overflow: hidden; }
    .file-name { font-size: 15px; font-weight: 600; color: #F1F5F9; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .file-meta { font-size: 12px; color: #64748B; margin-top: 3px; }
    .btn-download { background: #0284C7; color: #FFFFFF; text-decoration: none; padding: 8px 16px; border-radius: 10px; font-size: 13px; font-weight: 600; transition: background 0.2s; white-space: nowrap; }
    .btn-download:hover { background: #0369A1; }
    .empty { text-align: center; padding: 40px 10px; color: #64748B; font-size: 14px; }
    .loading { text-align: center; padding: 30px; color: #38BDF8; font-size: 15px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>Quick Share</h1>
      <p>Offline High-Speed Transfer</p>
      <div class="badge" id="statusBadge">Connecting...</div>
    </div>

    <div class="card">
      <div id="fileContainer" class="loading">Loading shared files...</div>
    </div>
  </div>

  <script>
    function formatBytes(bytes) {
      if (!bytes || bytes <= 0) return '0 B';
      var k = 1024;
      var sizes = ['B', 'KB', 'MB', 'GB', 'TB'];
      var i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(1)) + ' ' + sizes[i];
    }

    function escapeHtml(str) {
      var div = document.createElement('div');
      div.textContent = str;
      return div.innerHTML;
    }

    async function loadFiles() {
      var container = document.getElementById('fileContainer');
      var badge = document.getElementById('statusBadge');
      
      try {
        var res = await fetch('/api/files');
        if (!res.ok) throw new Error('Status: ' + res.status);
        var files = await res.json();

        badge.textContent = files.length + " files available";
        badge.style.color = "#34D399";
        badge.style.borderColor = "rgba(52, 211, 153, 0.4)";

        if (files.length === 0) {
          container.innerHTML = '<div class="empty">No files currently shared.</div>';
          return;
        }

        var html = '';
        files.forEach(function(f) {
          html += '<div class="file-item">' +
            '<div class="file-details">' +
              '<div class="file-name">' + escapeHtml(f.name) + '</div>' +
              '<div class="file-meta">' + formatBytes(f.size) + '</div>' +
            '</div>' +
            '<a class="btn-download" href="/api/download/' + encodeURIComponent(f.token) + '" download="' + escapeHtml(f.name) + '">Download</a>' +
          '</div>';
        });
        container.innerHTML = html;
      } catch (err) {
        badge.textContent = "Offline Session Ready";
        container.innerHTML = '<div class="empty">Ready to receive. Tap reload if files do not appear.</div>';
      }
    }

    window.addEventListener('DOMContentLoaded', loadFiles);
  </script>
</body>
</html>
