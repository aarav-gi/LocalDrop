<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LocalDrop</title>
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #3b82f6;
    --text: #f1f5f9;
    --muted: #94a3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    padding: 24px 16px 48px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin-bottom: 4px; }
  .status { color: var(--muted); font-size: 0.9rem; margin-bottom: 24px; }
  .status.ok { color: #4ade80; }
  .status.err { color: #f87171; }
  .file-card {
    background: var(--card);
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .file-info { min-width: 0; }
  .file-name { font-weight: 600; word-break: break-word; }
  .file-meta { color: var(--muted); font-size: 0.85rem; margin-top: 4px; }
  .btn {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 0.95rem;
    text-decoration: none;
    white-space: nowrap;
    cursor: pointer;
  }
  .btn:active { opacity: 0.8; }
  .empty { color: var(--muted); text-align: center; padding: 48px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>LocalDrop</h1>
  <div id="status" class="status">Connecting to sender…</div>
  <div id="fileList"></div>
</div>

<script>
(function () {
  function sessionTokenFromPath() {
    var m = window.location.pathname.match(/^\/s\/([A-Za-z0-9_-]+)/);
    return m ? m[1] : null;
  }

  var token = sessionTokenFromPath();
  var statusEl = document.getElementById('status');
  var listEl = document.getElementById('fileList');

  function formatBytes(bytes) {
    if (bytes <= 0) return '0 B';
    var units = ['B', 'KB', 'MB', 'GB', 'TB'];
    var i = Math.min(units.length - 1, Math.floor(Math.log(bytes) / Math.log(1024)));
    var value = bytes / Math.pow(1024, i);
    return (i === 0 ? bytes : value.toFixed(1)) + ' ' + units[i];
  }

  function renderFiles(files) {
    listEl.innerHTML = '';
    if (!files.length) {
      listEl.innerHTML = '<div class="empty">No files are currently shared.</div>';
      return;
    }
    files.forEach(function (f) {
      var card = document.createElement('div');
      card.className = 'file-card';
      card.innerHTML =
        '<div class="file-info">' +
          '<div class="file-name"></div>' +
          '<div class="file-meta"></div>' +
        '</div>' +
        '<a class="btn">DOWNLOAD</a>';
      card.querySelector('.file-name').textContent = f.name;
      card.querySelector('.file-meta').textContent = formatBytes(f.size) + ' · ' + f.mime;
      var link = card.querySelector('.btn');
      link.href = '/api/download/' + encodeURIComponent(f.token) + '?s=' + encodeURIComponent(token);
      link.setAttribute('download', f.name);
      listEl.appendChild(card);
    });
  }

  if (!token) {
    statusEl.textContent = 'Invalid or missing connection link.';
    statusEl.className = 'status err';
    return;
  }

  fetch('/api/files?s=' + encodeURIComponent(token))
    .then(function (r) {
      if (!r.ok) throw new Error('Session expired or invalid (HTTP ' + r.status + ')');
      return r.json();
    })
    .then(function (files) {
      statusEl.textContent = 'Connected to sender · ' + files.length + ' file(s) available';
      statusEl.className = 'status ok';
      renderFiles(files);
    })
    .catch(function (err) {
      statusEl.textContent = err.message;
      statusEl.className = 'status err';
    });
})();
</script>
</body>
</html>
